# For your own server / the free Oracle VM.  Usage:  cp .env.example .env  (edit it)  then  docker compose up -d --build
services:
  app:
    build: .
    restart: unless-stopped
    environment:
      - APP_PASSWORD=${APP_PASSWORD}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    volumes:
      - ./data:/app/data
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      - DOMAIN=${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [app]
volumes:
  caddy_data:
